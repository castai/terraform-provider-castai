name: Acceptance tests

on:
  pull_request:
    branches: [ '*' ]

jobs:
  files-changed:
    name: detect files changed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      acceptance-tests: ${{ steps.changes.outputs.acceptance-tests }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Check for file changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml
  aks:
    needs: files-changed
    if: needs.files-changed.outputs.acceptance-tests == 'true'
    # Only one instance per cloud should run at the same time
    concurrency:
      group: testacc-aks
    name: aks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Authenticate to onyx
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/883821977796/locations/global/workloadIdentityPools/onyx-github-pool/providers/onyx-github-terraform-provider

      - name: Read secrets from onyx
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          export_to_environment: true
          secrets: |-
            CASTAI_API_TOKEN:onyx-fyvd/terraform-provider-castai-token-dev
            ARM_CLIENT_SECRET:onyx-fyvd/terraform-provider-azure-client-secret
            SSO_CLIENT_SECRET:onyx-fyvd/terraform-provider-sso-client-secret

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.11.*'
          terraform_wrapper: false

      - name: Acceptance test
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_TF_ACCEPTANCE_TEST_ARM_CLIENT_ID_V2 }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_TF_ACCEPTANCE_TEST_ARM_SUBSCRIPTION_ID_V2 }}
          ARM_TENANT_ID: ${{ vars.AZURE_TF_ACCEPTANCE_TEST_ARM_TENANT_ID_V2 }}
          AZURE_TF_ACCEPTANCE_TEST_FEDERATION_ID: ${{ vars.AZURE_TF_ACCEPTANCE_TEST_FEDERATION_ID }}
          AZURE_TF_ACCEPTANCE_TEST_FEDERATION_TENANT_ID: ${{ vars.AZURE_TF_ACCEPTANCE_TEST_ARM_TENANT_ID_V2 }}
          AZURE_TF_ACCEPTANCE_TEST_FEDERATION_CLIENT_ID: ${{ vars.AZURE_TF_ACCEPTANCE_TEST_FEDERATION_CLIENT_ID }}
          SSO_CLIENT_ID: ${{ vars.SSO_CLIENT_ID }}
          SSO_DOMAIN: ${{ vars.SSO_DOMAIN }}
          ACCEPTANCE_TEST_ORGANIZATION_ID: ${{ vars.TF_ACCEPTANCE_TEST_ORGANIZATION_ID }}
        run: make testacc-aks
  eks:
    needs: files-changed
    if: needs.files-changed.outputs.acceptance-tests == 'true'
    # Only one instance per cloud should run at the same time
    concurrency:
      group: testacc-eks
    name: eks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Authenticate to onyx
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/883821977796/locations/global/workloadIdentityPools/onyx-github-pool/providers/onyx-github-terraform-provider

      - name: Read secrets from onyx
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          export_to_environment: true
          secrets: |-
            CASTAI_API_TOKEN:onyx-fyvd/terraform-provider-castai-token-dev
            AWS_ACCESS_KEY_ID:onyx-fyvd/terraform-provider-aws-access-key-id
            AWS_SECRET_ACCESS_KEY:onyx-fyvd/terraform-provider-aws-secret-access-key
            SSO_CLIENT_SECRET:onyx-fyvd/terraform-provider-sso-client-secret

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.11.*'
          terraform_wrapper: false

      - name: Acceptance test
        env:
          SSO_CLIENT_ID: ${{ vars.SSO_CLIENT_ID }}
          SSO_DOMAIN: ${{ vars.SSO_DOMAIN }}
          ACCEPTANCE_TEST_ORGANIZATION_ID: ${{ vars.TF_ACCEPTANCE_TEST_ORGANIZATION_ID }}
        run: make testacc-eks
  gke:
    needs: files-changed
    if: needs.files-changed.outputs.acceptance-tests == 'true'
    # Only one instance per cloud should run at the same time
    concurrency:
      group: testacc-gke
    name: gke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Authenticate to onyx
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/883821977796/locations/global/workloadIdentityPools/onyx-github-pool/providers/onyx-github-terraform-provider

      - name: Read secrets from onyx
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          export_to_environment: true
          secrets: |-
            CASTAI_API_TOKEN:onyx-fyvd/terraform-provider-castai-token-dev
            GOOGLE_CREDENTIALS:onyx-fyvd/terraform-provider-google-credentials
            SSO_CLIENT_SECRET:onyx-fyvd/terraform-provider-sso-client-secret

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.11.*'
          terraform_wrapper: false

      # Re-authenticates as the acceptance-test service account: the onyx WIF
      # principal from the steps above has no access to the tf-acc GCP project.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GOOGLE_CREDENTIALS }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: tf-core-acc-20230723
          location: us-central1-c
          project_id: ${{ vars.GOOGLE_TF_ACCEPTANCE_PROJECT_ID }}

      - name: Acceptance test
        env:
          GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_TF_ACCEPTANCE_PROJECT_ID }}
          SSO_CLIENT_ID: ${{ vars.SSO_CLIENT_ID }}
          SSO_DOMAIN: ${{ vars.SSO_DOMAIN }}
          ACCEPTANCE_TEST_ORGANIZATION_ID: ${{ vars.TF_ACCEPTANCE_TEST_ORGANIZATION_ID }}
        run: make testacc-gke
  cloud-agnostic:
    needs: files-changed
    if: needs.files-changed.outputs.acceptance-tests == 'true'
    # Only one instance per cloud should run at the same time
    concurrency:
      group: testacc-cloud-agnostic
    name: cloud-agnostic
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Authenticate to onyx
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/883821977796/locations/global/workloadIdentityPools/onyx-github-pool/providers/onyx-github-terraform-provider

      - name: Read secrets from onyx
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          export_to_environment: true
          secrets: |-
            CASTAI_API_TOKEN:onyx-fyvd/terraform-provider-castai-token-dev
            SSO_CLIENT_SECRET:onyx-fyvd/terraform-provider-sso-client-secret

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.11.*'
          terraform_wrapper: false

      - name: Acceptance test
        env:
          SSO_CLIENT_ID: ${{ vars.SSO_CLIENT_ID }}
          SSO_DOMAIN: ${{ vars.SSO_DOMAIN }}
          ACCEPTANCE_TEST_ORGANIZATION_ID: ${{ vars.TF_ACCEPTANCE_TEST_ORGANIZATION_ID }}
        run: make testacc-cloud-agnostic

